name: Update Feed

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update.yml'
      - 'index.js'
      - 'allo.js'
      - 'eva.js'
      - 'feedDownloader.js'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install

      - run: node index.js

      - run: node allo.js

      - run: node eva.js

      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add rozetka.xml allo.xml eva.xml
          git commit -m "auto update" || echo "no changes"
          git push
