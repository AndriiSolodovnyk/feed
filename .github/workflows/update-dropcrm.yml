name: DropCRM

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dropcrm
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download DropCRM feed
        env:
          DROPCRM_BEARER_TOKEN: ${{ secrets.DROPCRM_BEARER_TOKEN }}
        run: node dropcrm.js

      - name: Publish updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.yml
          git diff --cached --quiet && exit 0
          git commit -m "Update DropCRM feed"
          git push
